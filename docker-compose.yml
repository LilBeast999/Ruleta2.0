version: '3.8'

services:
  # Backend service (Python/Flask)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruleta_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    networks:
      - ruleta_network
    restart: unless-stopped

  # Frontend service (React con nginx)
  frontend:
    build:
      context: ./mi-proyecto
      dockerfile: Dockerfile
    container_name: ruleta_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ruleta_network
    restart: unless-stopped

networks:
  ruleta_network:
    driver: bridge