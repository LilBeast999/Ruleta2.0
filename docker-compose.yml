version: '3.8'

services:
  # Backend service (Python)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruleta_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    volumes:
      - ./backend:/app
    networks:
      - ruleta_network
    restart: unless-stopped

  # Frontend service (React)
  frontend:
    build:
      context: ./mi-proyecto
      dockerfile: Dockerfile
    container_name: ruleta_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ruleta_network
    restart: unless-stopped

  # Base de datos (opcional - si usas PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: ruleta_db
    environment:
      POSTGRES_DB: ruleta_db
      POSTGRES_USER: ruleta_user
      POSTGRES_PASSWORD: ruleta_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - ruleta_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ruleta_network:
    driver: bridge